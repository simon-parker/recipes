---
layout: default
---

<article class="recipe">
  <nav class="back"><a href="{{ '/' | relative_url }}">← All recipes</a></nav>
  <h1>{{ page.title }}</h1>
  {% if page.description %}<p class="description">{{ page.description }}</p>{% endif %}
  {% if page.tags %}
    <ul class="tags">
      {% for tag in page.tags %}<li>{{ tag }}</li>{% endfor %}
    </ul>
  {% endif %}
  {{ content }}
</article>
